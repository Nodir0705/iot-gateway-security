#!/usr/sbin/nft -f
flush ruleset

table inet iot_gateway {
    set quarantine_v4 {
        type ipv4_addr
        flags timeout
        comment "Quarantined IoT devices"
    }

    chain input {
        type filter hook input priority 0; policy accept;
        ip saddr @quarantine_v4 counter drop comment "Block quarantined devices"
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        ip saddr @quarantine_v4 counter drop comment "Block quarantined forwarding"
        ip daddr @quarantine_v4 counter drop comment "Block traffic to quarantined"
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
